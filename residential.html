<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Residential Projects | Kieback & Peter ME LLC</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;600;700&display=swap');

        :root {
            --orange: #E8730A;
            --dark-navy: #060E1A;
            --mid-navy: #0F2040;
            --white: #F5F0E8;
            --gray: #8899AA;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--dark-navy); color: var(--white); font-family: 'Rajdhani', sans-serif; }

        /* Navbar */
        nav { padding: 20px 60px; display: flex; justify-content: space-between; align-items: center; background: rgba(6,14,26,0.95); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(232,115,10,0.1); }
        .logo { font-size: 24px; font-weight: 700; color: var(--white); }
        .logo span { color: var(--orange); }

        /* Main */
        main { padding: 80px 60px; min-height: 80vh; }
        h1 { font-size: 48px; margin-bottom: 10px; color: var(--white); }
        h1 span { color: var(--orange); }
        p.subtitle { color: var(--gray); margin-bottom: 50px; font-size: 18px; }

        /* Grid */
        .projects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; }
        .project-card { background: var(--mid-navy); padding: 25px; border-radius: 15px; border: 1px solid rgba(232,115,10,0.2); transition: 0.4s; }
        .project-card:hover { transform: translateY(-10px); border-color: var(--orange); }
        .project-card img { width: 100%; height: 180px; object-fit: cover; border-radius: 10px; margin-bottom: 20px; }
        .project-card h3 { color: var(--orange); margin-bottom: 10px; font-size: 22px; }
        .project-card p { color: var(--gray); font-size: 14px; margin-bottom: 5px; }
        .tech-tag { display: inline-block; background: rgba(232,115,10,0.1); color: var(--orange); padding: 5px 12px; border-radius: 5px; font-size: 12px; margin-top: 15px; }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" style="text-decoration:none;"><div class="logo">KIEBACK <span>&</span> PETER ME LLC</div></a>
    </nav>

    <main>
        <h1>Our <span>Residential Projects</span></h1>
        <p class="subtitle">High-end automation for residential towers, apartments, and waterfront developments.</p>
        
        <div class="projects-grid" id="projects-container"></div>
    </main>

    <script src="projects-data.js"></script>
    <script>
        
        const categoryToLoad = "residential"; 
        
        const container = document.getElementById('projects-container');
        const filtered = allProjects.filter(p => p.category === categoryToLoad);

        filtered.forEach(p => {
            container.innerHTML += `
                <div class="project-card">
                    <img src="${p.img}" alt="${p.name}">
                    <h3>${p.name}</h3>
                    <p>📍 Location: ${p.country}</p>
                    <p>📊 Points: ${p.points}</p>
                    <p>💰 Value: ${p.value}</p>
                    <div class="tech-tag">${p.system}</div>
                </div>
            `;
        });
    </script>
</body>
</html>
